name: CI — Build & Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            qt6-base-dev \
            libqt6sql6-sqlite \
            qt6-svg-dev \
            libx11-dev \
            libxfixes-dev \
            libxtst-dev \
            libqrencode-dev \
            zlib1g-dev

      - name: Configure & Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build -j"$(nproc)"

      - name: Run CTest suite (unit tests + i18n validation)
        run: |
          ctest --test-dir build --output-on-failure
