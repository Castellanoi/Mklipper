name: Build and Release .deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            dpkg-dev \
            apt-utils \
            gnupg \
            gpgv \
            qt6-base-dev \
            libqt6sql6-sqlite \
            qt6-svg-dev \
            libx11-dev \
            libxfixes-dev \
            libxtst-dev \
            libqrencode-dev \
            zlib1g-dev

      - name: Build .deb package and SHA256SUMS
        run: |
          rm -f dist/*.deb dist/SHA256SUMS
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh
          (cd dist && sha256sum -c SHA256SUMS)
          dpkg-deb --info dist/mklipper_*_amd64.deb

      - name: Prepare release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VER="$(sed -n 's/^project(mklipper VERSION \([0-9][^ ]*\).*/\1/p' CMakeLists.txt | head -n 1)"
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

          awk -v tag="## ${TAG}" '
            $0 == tag { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md || true

          if [ ! -s release_notes.md ]; then
            echo "Release ${TAG} de Mklipper." > release_notes.md
          fi
          cat release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: Mklipper ${{ steps.notes.outputs.tag }}
          body_path: release_notes.md
          files: |
            dist/mklipper_*_amd64.deb
            dist/SHA256SUMS

      - name: Publish signed APT repository (apt-repo branch)
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          if [ -z "${APT_GPG_PRIVATE_KEY}" ]; then
            echo "::warning::APT_GPG_PRIVATE_KEY secret is not configured; skipping apt-repo branch update."
            exit 0
          fi

          GNUPGHOME="$(mktemp -d)"
          chmod 700 "${GNUPGHOME}"
          export GNUPGHOME
          trap 'rm -rf "${GNUPGHOME}"' EXIT

          printf '%s\n' "${APT_GPG_PRIVATE_KEY}" | gpg --batch --import

          APT_WORK="$(mktemp -d)"
          trap 'rm -rf "${GNUPGHOME}" "${APT_WORK}"' EXIT

          git fetch origin apt-repo:refs/remotes/origin/apt-repo 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/apt-repo; then
            git worktree add "${APT_WORK}" origin/apt-repo
            (cd "${APT_WORK}" && git checkout -B apt-repo)
          else
            git worktree add --orphan -b apt-repo "${APT_WORK}"
          fi

          chmod +x packaging/build-apt-repo.sh
          ./packaging/build-apt-repo.sh "${APT_WORK}" dist/mklipper_*_amd64.deb

          cd "${APT_WORK}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update APT repository for Mklipper ${{ steps.notes.outputs.tag }}"
            git push origin apt-repo
          fi
