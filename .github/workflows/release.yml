name: Build and Release .deb

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            libqt6sql6-sqlite \
            qt6-svg-dev \
            libx11-dev \
            libxfixes-dev \
            libxtst-dev \
            libqrencode-dev \
            zlib1g-dev

      - name: Build .deb package and SHA256SUMS
        run: |
          rm -f dist/*.deb dist/SHA256SUMS
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh
          (cd dist && sha256sum -c SHA256SUMS)
          dpkg-deb --info dist/mklipper_*_amd64.deb

      - name: Prepare release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VER="$(sed -n 's/^project(mklipper VERSION \([0-9][^ ]*\).*/\1/p' CMakeLists.txt | head -n 1)"
            TAG="v${VER}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

          awk -v tag="## ${TAG}" '
            $0 == tag { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md || true

          if [ ! -s release_notes.md ]; then
            echo "Release ${TAG} de Mklipper." > release_notes.md
          fi
          cat release_notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.notes.outputs.tag }}"
          DEB_FILE="$(ls dist/mklipper_*_amd64.deb | head -n 1)"
          for attempt in 1 2 3; do
            if gh release view "${TAG}" >/dev/null 2>&1; then
              if gh release upload "${TAG}" "${DEB_FILE}" dist/SHA256SUMS --clobber \
                && gh release edit "${TAG}" --title "Mklipper ${TAG}" --notes-file release_notes.md; then
                exit 0
              fi
            else
              if gh release create "${TAG}" "${DEB_FILE}" dist/SHA256SUMS \
                --title "Mklipper ${TAG}" \
                --notes-file release_notes.md; then
                exit 0
              fi
            fi
            echo "Attempt ${attempt} failed; retrying in 5s..." >&2
            sleep 5
          done
          exit 1
